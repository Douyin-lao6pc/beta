<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录验证</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            width: 320px;
            text-align: center;
        }
        h2 { margin-bottom: 24px; color: #333; }
        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 4px;
        }
        .input-group input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .input-group input:focus {
            outline: none;
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24,144,255,0.2);
        }
        button {
            width: 100%;
            padding: 10px;
            background: #1890ff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background: #40a9ff; }
        button:disabled {
            background: #d9d9d9;
            cursor: not-allowed;
        }
        #message {
            margin-top: 16px;
            font-size: 14px;
            color: #ff4d4f;
            min-height: 20px;
        }
        .info {
            margin-top: 12px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>🔐 登录验证</h2>
    <div class="input-group">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请输入用户名">
    </div>
    <div class="input-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码">
    </div>
    <button id="loginBtn">登 录</button>
    <div id="message"></div>
    <div class="info">如果忘记密码请在抖音内测群联系</div>
</div>

<script>
    // ============================================================
    //  使用 Web Crypto API 计算 SHA256（十六进制小写）
    // ============================================================
    async function sha256Hex(message) {
        const encoder = new TextEncoder();
        const data = encoder.encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // ============================================================
    //  解析 password.txt 内容，提取 username 和 pwd
    // ============================================================
    function parseAuthFile(content) {
        // 格式：username="xxx",pwd="hash",passage=winsoftware
        const userMatch = content.match(/username="([^"]*)"/);
        const pwdMatch = content.match(/pwd="([^"]*)"/);
        if (userMatch && pwdMatch) {
            return { username: userMatch[1], pwdHash: pwdMatch[1] };
        }
        return null;
    }

    // ============================================================
    //  主登录逻辑
    // ============================================================
    const loginBtn = document.getElementById('loginBtn');
    const messageEl = document.getElementById('message');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');

    // 回车键触发登录
    passwordInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') loginBtn.click();
    });
    usernameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') loginBtn.click();
    });

    loginBtn.addEventListener('click', async () => {
        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        // 简单校验
        if (!username) {
            messageEl.textContent = '⚠️ 请输入用户名';
            return;
        }
        if (!password) {
            messageEl.textContent = '⚠️ 请输入密码';
            return;
        }

        messageEl.textContent = '⏳ 正在验证...';
        loginBtn.disabled = true;

        try {
            // 1. 获取 password.txt（同目录）
            //   如果部署在 GitHub Pages，且 index.html 与 password.txt 同目录，
            //   则直接使用相对路径。
            const response = await fetch('password.txt');
            if (!response.ok) {
                throw new Error('无法获取 password.txt（状态码：' + response.status + '）');
            }
            const content = await response.text();

            // 2. 解析文件
            const parsed = parseAuthFile(content);
            if (!parsed) {
                throw new Error('password.txt 格式错误，请检查 username 和 pwd 字段');
            }

            // 3. 计算输入密码的哈希
            const inputHash = await sha256Hex(password);

            // 4. 比对
            if (username === parsed.username && inputHash === parsed.pwdHash) {
                messageEl.style.color = '#52c41a';
                messageEl.textContent = '✅ 验证通过，正在跳转...';
                // 跳转到 page.html（同目录）
                window.location.href = 'page.html';
            } else {
                messageEl.style.color = '#ff4d4f';
                messageEl.textContent = '❌ 用户名或密码错误';
                loginBtn.disabled = false;
            }
        } catch (error) {
            messageEl.style.color = '#ff4d4f';
            messageEl.textContent = '⚠️ ' + error.message;
            loginBtn.disabled = false;
        }
    });
</script>

</body>
</html>
